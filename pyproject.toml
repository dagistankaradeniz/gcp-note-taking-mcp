[project]
name = "quillink-mcp"
version = "0.1.0"
description = "MCP server exposing read-only access to your Quillink notes, folders, and tags."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.scripts]
quillink-mcp = "quillink_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quillink_mcp"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
