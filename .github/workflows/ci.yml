name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Import smoke test
        run: |
          python -c "
          import asyncio
          from quillink_mcp.server import mcp

          async def main():
              tools = await mcp.list_tools()
              assert len(tools) == 9, f'expected 9 tools, got {len(tools)}'
              print(f'{len(tools)} tools registered OK')

          asyncio.run(main())
          "
